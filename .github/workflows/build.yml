name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Collect jars
        id: jars
        run: |
          mkdir -p dist
          cp linker/build/libs/minecraft-agent-linker-*.jar dist/ 2>/dev/null || true
          cp mc-plugin/build/libs/MinecraftAgentIDE-*.jar dist/ 2>/dev/null || true
          echo "Built artifacts:"
          ls -la dist/

      - name: Upload linker jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-agent-linker
          path: linker/build/libs/minecraft-agent-linker-*.jar
          if-no-files-found: error

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftAgentIDE-plugin
          path: mc-plugin/build/libs/MinecraftAgentIDE-*.jar
          if-no-files-found: error

      - name: Comment build artifacts on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- minecraft-agent-ide-build -->';
            const body = [
              marker,
              '### 📦 Build artifacts ready',
              '',
              `Commit \`${context.sha.substring(0, 7)}\` built successfully.`,
              '',
              'Download the jars from the **Artifacts** section of this workflow run:',
              '',
              `- 🔗 [Workflow run & downloads](${runUrl})`,
              '  - `minecraft-agent-linker` — the desktop linker fat jar',
              '  - `MinecraftAgentIDE-plugin` — the Paper plugin jar',
              '',
              '_Artifacts are retained for 90 days and refreshed on every commit to this PR._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
